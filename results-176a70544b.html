<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Ride poll results</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:#8b949e;font-size:14px;margin-bottom:22px}
.card{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;color:#8b949e;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em}
.line{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;margin-top:10px}
.num{font-size:34px}
.bar{height:12px;border-radius:6px;background:#21262d;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;transition:width .4s}
.y{background:#2ea043}.n{background:#6e7681}.t{background:linear-gradient(90deg,#1f6feb,#7c3aed)}.b{background:linear-gradient(90deg,#d97706,#9a3412)}
button{width:100%;min-height:60px;font-size:20px;font-weight:700;border:0;border-radius:16px;background:#238636;color:#fff;cursor:pointer}
.note{color:#6e7681;font-size:13px;margin-top:16px;line-height:1.4}
</style>
</head>
<body>
<main>
  <h1>🚗 Ride poll results</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="card">
    <h2>Want a pickup?</h2>
    <div class="line"><span>👍 Yes</span><span class="num" id="c-yes">–</span></div>
    <div class="bar"><i class="y" id="b-yes"></i></div>
    <div class="line"><span>👎 No</span><span class="num" id="c-no">–</span></div>
    <div class="bar"><i class="n" id="b-no"></i></div>
  </div>
  <div class="card">
    <h2>Tesla or Bronco?</h2>
    <div class="line"><span>⚡ Tesla</span><span class="num" id="c-tesla">–</span></div>
    <div class="bar"><i class="t" id="b-tesla"></i></div>
    <div class="line"><span>🛣️ Bronco</span><span class="num" id="c-bronco">–</span></div>
    <div class="bar"><i class="b" id="b-bronco"></i></div>
  </div>
  <button id="refresh">↻ Refresh</button>
  <p class="note">Counts are anonymous (one per device). Names come in via the texts people send you. Auto-refreshes every 30s.</p>
</main>
<script>
(function(){
  var NS = "applesdg-ride-poll-da04107c";
  var BASE = "https://abacus.jasoncameron.dev/get/" + NS + "/";
  var KEYS = {yes:"ride_yes", no:"ride_no", tesla:"tesla", bronco:"bronco"};
  function get(k){
    return fetch(BASE + KEYS[k], {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : {value:0}; })
      .then(function(j){ return Math.max(0, j.value|0); }).catch(function(){ return null; });
  }
  function set(id,v,tot){
    document.getElementById("c-"+id).textContent = v===null ? "?" : v;
    document.getElementById("b-"+id).style.width = (tot ? Math.round(100*(v||0)/tot) : 0) + "%";
  }
  function load(){
    document.getElementById("updated").textContent = "Refreshing…";
    Promise.all(["yes","no","tesla","bronco"].map(get)).then(function(v){
      var a=v[0]||0,b=v[1]||0,c=v[2]||0,d=v[3]||0;
      set("yes",v[0],a+b); set("no",v[1],a+b); set("tesla",v[2],c+d); set("bronco",v[3],c+d);
      var err = v.some(function(x){return x===null;});
      document.getElementById("updated").textContent = (err ? "⚠️ Couldn't reach counter · " : "") + "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"}) + " · " + (a+b) + " responses";
    });
  }
  document.getElementById("refresh").addEventListener("click", load);
  load(); setInterval(load, 30000);
})();
</script>
</body>
</html>
